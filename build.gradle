plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.version
group = project.group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
}

def baritoneVersion = project.baritone_version
def baritoneFile = file("build/deps/baritone-api-fabric-${baritoneVersion}.jar")

dependencies {
	// Minecraft 26.1+ ships unobfuscated (official names), so Loom needs no `mappings` dependency.
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	// This mod only needs the loader (no Fabric API dependency).
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Baritone's API (IBaritone / IBaritoneProvider / BaritoneAPI). Baritone is a hard runtime
	// dependency declared in fabric.mod.json; its jar must not be bundled, so compileOnly.
	compileOnly files(baritoneFile)
}

def baritoneUrl =
		"https://github.com/cabaletta/baritone/releases/download/v${baritoneVersion}/baritone-api-fabric-${baritoneVersion}.jar"
def baritoneSha256 = '49adfc063cfbfd0b6f08e9d814359807baa2d1768c0d39d6c5968268547cbca6'

// The official Baritone release is the only source of its API classes. Keep the pinned jar in
// build/deps (gitignored) so the repository stays source-only. The task has no declared outputs on
// purpose: Gradle's stale-output cleanup would otherwise delete a jar that is already in place.
tasks.register('downloadBaritone') {
	group = 'build setup'
	description = "Downloads Baritone ${baritoneVersion}'s API jar for compilation."

	doLast {
		if (baritoneFile.exists() && sha256(baritoneFile) == baritoneSha256) {
			return
		}

		baritoneFile.parentFile.mkdirs()
		def partial = new File(baritoneFile.parentFile, baritoneFile.name + '.part')
		println "downloading ${baritoneUrl}"
		def connection = new URL(baritoneUrl).openConnection()
		connection.instanceFollowRedirects = true
		connection.connectTimeout = 15_000
		connection.readTimeout = 180_000
		partial.withOutputStream { out ->
			connection.inputStream.withCloseable { input ->
				out << input
			}
		}

		if (sha256(partial) != baritoneSha256) {
			throw new GradleException("Baritone jar checksum mismatch: expected ${baritoneSha256}, got "
					+ "${sha256(partial)}. Delete ${partial} and try again.")
		}
		java.nio.file.Files.move(partial.toPath(), baritoneFile.toPath(),
				java.nio.file.StandardCopyOption.REPLACE_EXISTING)
	}
}

def sha256(File file) {
	def digest = java.security.MessageDigest.getInstance('SHA-256')
	file.withInputStream { input ->
		byte[] buffer = new byte[8192]
		int read
		while ((read = input.read(buffer)) > 0) {
			digest.update(buffer, 0, read)
		}
	}
	return digest.digest().collect { String.format('%02x', it) }.join()
}

tasks.named('compileJava') {
	dependsOn 'downloadBaritone'
}

processResources {
	def modVersion = project.version
	inputs.property "version", modVersion

	filesMatching("fabric.mod.json") {
		expand "version": modVersion
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
	withSourcesJar()
}

// Minecraft 26.1+ is unobfuscated, so there is no remapJar step: the plain jar is loadable.
// If a Loom version does provide remapJar, name it consistently.
tasks.matching { it.name == 'remapJar' }.configureEach {
	archiveFileName = "mgbaritonecrashguard-${project.version}.jar"
}
